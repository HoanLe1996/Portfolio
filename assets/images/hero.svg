<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title">
  <title id="title">HoanLV - Full-Stack Developer avatar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="210" cy="215" r="170"/>
    </clipPath>
    <style>
      .float-a { animation: float 5s ease-in-out infinite; }
      .float-b { animation: float 6s ease-in-out -2s infinite; }
      .float-c { animation: float 5.5s ease-in-out -4s infinite; }
      .blink { animation: blink 5s infinite; transform-origin: 210px 200px; }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
    </style>
  </defs>

  <!-- backdrop -->
  <circle cx="210" cy="215" r="170" fill="url(#bg)"/>
  <circle cx="210" cy="215" r="170" fill="url(#glow)"/>
  <circle cx="210" cy="215" r="186" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 10"/>

  <g clip-path="url(#circle)">
    <!-- subtle code lines in the background -->
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="70" y="120" width="54" height="8" rx="4"/>
      <rect x="70" y="136" width="34" height="8" rx="4"/>
      <rect x="84" y="152" width="46" height="8" rx="4"/>
      <rect x="296" y="112" width="50" height="8" rx="4"/>
      <rect x="306" y="128" width="40" height="8" rx="4"/>
      <rect x="296" y="144" width="28" height="8" rx="4"/>
    </g>

    <!-- body -->
    <path d="M86 430 C 90 350, 132 316, 210 312 C 288 316, 330 350, 334 430 Z" fill="url(#shirt)"/>
    <!-- neck -->
    <path d="M186 262 h48 v40 c0 14 -48 14 -48 0 Z" fill="#e3a982"/>
    <path d="M186 284 c14 10 34 10 48 0 v-10 c-14 10 -34 10 -48 0 Z" fill="#c98d68" opacity="0.6"/>
    <!-- collar -->
    <path d="M178 312 c10 18 54 18 64 0 l-8 -6 c-10 12 -38 12 -48 0 Z" fill="#334155"/>

    <!-- ears -->
    <ellipse cx="149" cy="206" rx="11" ry="17" fill="#e8ad86"/>
    <ellipse cx="271" cy="206" rx="11" ry="17" fill="#e8ad86"/>
    <!-- head -->
    <ellipse cx="210" cy="200" rx="60" ry="70" fill="#f3c4a0"/>

    <!-- hair -->
    <path d="M150 196 C 140 140, 168 108, 212 106 C 256 106, 282 136, 270 196 C 266 174, 258 160, 246 152 C 226 160, 196 158, 174 146 C 164 158, 154 174, 150 196 Z" fill="#111827"/>
    <path d="M170 132 C 190 112, 236 108, 256 128 C 236 120, 204 122, 186 140 Z" fill="#1f2937"/>
    <path d="M174 146 C 196 158, 226 160, 246 152 C 236 146, 222 144, 214 136 C 204 146, 190 148, 174 146 Z" fill="#111827"/>

    <!-- eyebrows -->
    <path d="M176 182 q 12 -8 24 -2" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M220 180 q 12 -6 24 2" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <g class="blink">
      <ellipse cx="189" cy="200" rx="6" ry="7" fill="#111827"/>
      <ellipse cx="231" cy="200" rx="6" ry="7" fill="#111827"/>
      <circle cx="191" cy="197" r="2" fill="#ffffff"/>
      <circle cx="233" cy="197" r="2" fill="#ffffff"/>
    </g>
    <!-- nose -->
    <path d="M210 208 q 6 14 -3 18" stroke="#d4936c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="173" cy="226" r="9" fill="#f43f5e" opacity="0.15"/>
    <circle cx="247" cy="226" r="9" fill="#f43f5e" opacity="0.15"/>
    <!-- smile -->
    <path d="M190 238 q 20 18 40 0" stroke="#9a3412" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- laptop -->
    <rect x="128" y="336" width="164" height="100" rx="12" fill="url(#laptop)"/>
    <rect x="128" y="336" width="164" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <text x="210" y="374" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#4f46e5">&lt;/&gt;</text>
  </g>

  <!-- floating badges -->
  <g class="float-a">
    <rect x="22" y="96" width="70" height="70" rx="18" fill="#ffffff"/>
    <g transform="translate(57 131)" fill="none" stroke="#06b6d4" stroke-width="3.5">
      <ellipse rx="22" ry="8.5"/>
      <ellipse rx="22" ry="8.5" transform="rotate(60)"/>
      <ellipse rx="22" ry="8.5" transform="rotate(120)"/>
      <circle r="4" fill="#06b6d4" stroke="none"/>
    </g>
  </g>
  <g class="float-b">
    <rect x="322" y="70" width="70" height="70" rx="18" fill="#ffffff"/>
    <text x="357" y="115" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#4f46e5">{ }</text>
  </g>
  <g class="float-c">
    <rect x="326" y="300" width="70" height="70" rx="18" fill="#ffffff"/>
    <path d="M344 346 a 11 11 0 0 1 2 -21.5 a 15 15 0 0 1 28.5 2.5 a 10 10 0 0 1 3.5 19 Z" fill="#f59e0b"/>
  </g>
  <g class="float-b">
    <rect x="16" y="300" width="64" height="64" rx="16" fill="#ffffff"/>
    <text x="48" y="341" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">AWS</text>
  </g>
</svg>
